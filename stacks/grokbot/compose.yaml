# Deployed by the stacks role to /opt/homelab/stacks/grokbot.
# Discord bot (https://github.com/ethbra/grokbot): gpt-6-luna answers, Grok on call
# for X search. Outbound only (Discord gateway, OpenAI, xAI, Tavily): no ports,
# no tunnel hostname, no nginx route.
# Secrets come from the root-only .env the stacks role renders from SOPS.
# Default bridge like the media apps, so no auto-addressed network can take
# 172.18.0.0/16, which Crafty's network must keep.
# The image starts as root only to chown /data/state, then runs as 1000:1000.
# ollama: a small local model that decides whether a message without an @ is a
# follow-up meant for the bot. It shares grokbot's network namespace, so the bot
# reaches it on 127.0.0.1:11434 and nothing else can (no ports, no other network).
# Messages it judges never leave the box. The bot pulls the model on first start.
name: grokbot
services:
  grokbot:
    image: ghcr.io/ethbra/grokbot:0.6.0
    container_name: grokbot
    network_mode: bridge
    restart: unless-stopped
    environment:
      TZ: America/Los_Angeles
      DISCORD_TOKEN: ${GROKBOT_DISCORD_TOKEN}
      OPENAI_API_KEY: ${GROKBOT_OPENAI_API_KEY}
      XAI_API_KEY: ${GROKBOT_XAI_API_KEY}
      TAVILY_API_KEY: ${GROKBOT_TAVILY_API_KEY}
      MODEL: gpt-6-luna
      GROK_MODEL: grok-4.3
      DEFAULT_SEARCH: auto
      DAILY_BUDGET_USD: "2.00"
      PER_USER_DAILY_USD: "0.50"
      OLLAMA_URL: http://127.0.0.1:11434
      INTERJECT_MODEL: qwen2.5:1.5b-instruct-q4_K_M
    volumes:
      - /srv/appdata/grokbot:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    # Uses ~50 MB; the cap only stops a runaway from taking the box down.
    mem_limit: 512m
    memswap_limit: 512m

  ollama:
    image: ollama/ollama:0.40.15
    container_name: ollama
    network_mode: "service:grokbot"
    depends_on: [grokbot]
    restart: unless-stopped
    runtime: nvidia
    environment:
      TZ: America/Los_Angeles
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_KEEP_ALIVE: "-1"
      # Bound GPU and RAM use: one model, one request at a time, short context.
      # The 1.5B q4 model then needs ~1.5 GB of VRAM (or RAM on CPU fallback).
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "2048"
    volumes:
      - /srv/appdata/ollama:/root/.ollama
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Room for the model on CPU fallback plus runtime; no swap (swap is already full).
    mem_limit: 3g
    memswap_limit: 3g
