# dash.ethbra.com -> Homepage (stacks/homepage). Behind Cloudflare Access.
# Homepage checks the Host against HOMEPAGE_ALLOWED_HOSTS.
server {
    listen 127.0.0.1:8080;
    server_name dash.ethbra.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
}
