# Shared settings (http context; files load in name order).
server_tokens off;

# Only cloudflared (on this host) talks to nginx; the visitor's address is in
# CF-Connecting-IP, set by Cloudflare.
set_real_ip_from 127.0.0.1;
real_ip_header CF-Connecting-IP;

# Websockets: upgrade when the client asks, plain keep-alive otherwise.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Unknown hostnames get nothing (connection closed, no response).
server {
    listen 127.0.0.1:8080 default_server;
    server_name _;
    return 444;
}
