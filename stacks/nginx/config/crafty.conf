# crafty.ethbra.com -> Crafty's panel (stacks/crafty). Behind Cloudflare
# Access; Crafty's own login and 2FA still apply.
server {
    listen 127.0.0.1:8080;
    server_name crafty.ethbra.com;

    # Uploads (server imports, files) through the panel.
    client_max_body_size 4g;

    location / {
        # Crafty only serves https, with its own self-signed certificate.
        proxy_pass https://127.0.0.1:8111;
        proxy_ssl_verify off;
        include /etc/nginx/conf.d/proxy-headers.inc;
        # Console output is a long-lived websocket.
        proxy_read_timeout 1h;
    }
}
