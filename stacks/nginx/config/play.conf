# play.ethbra.com -> BlueMap of the live Minecraft server (port 8100 in
# crafty-container; any server with BlueMap's web server on 8100).
# Public: Access bypasses this name. The game itself reaches play.ethbra.com
# through the SRV record, not through here.
#
# The only entry without a login, so it is read-only and rate limited per
# visitor (the real IP, from CF-Connecting-IP; see 00-common.conf).
# A page load bursts to ~200 requests/s (tiles), then about 1/s per map
# (live/players.json), so the burst is generous and the steady rate is not.
limit_req_zone $binary_remote_addr zone=map_req:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=map_conn:10m;

server {
    listen 127.0.0.1:8080;
    server_name play.ethbra.com;

    # No request bodies: the map only reads.
    client_max_body_size 1k;

    limit_req zone=map_req burst=500 nodelay;
    limit_conn map_conn 50;
    limit_req_status 429;
    limit_conn_status 429;

    location / {
        # GET (and HEAD, which nginx includes with GET) only; anything else 403.
        # BlueMap itself answers HEAD with 400, so in practice only GET works.
        limit_except GET {
            deny all;
        }
        proxy_pass http://127.0.0.1:8100;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
}
