# play.ethbra.com -> BlueMap (a mod on ATM10, port 8100 in crafty-container).
# Public: Access bypasses this name. The game itself reaches play.ethbra.com
# through the SRV record, not through here.
server {
    listen 127.0.0.1:8080;
    server_name play.ethbra.com;

    location / {
        proxy_pass http://127.0.0.1:8100;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
}
