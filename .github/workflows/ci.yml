# Validation only. This workflow never deploys and never touches the server:
# the server pulls and applies signed commits itself (docs/design/IAC-DESIGN.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: yamllint
        run: |
          pip install --quiet yamllint==1.38.0
          yamllint --strict .
      - name: shellcheck
        run: find scripts -name '*.sh' -type f -not -path 'scripts/obsolete/*' -print0 | xargs -0 -r shellcheck
      - name: secrets/ is encrypted
        run: scripts/check-sops-encrypted.sh

  gitleaks:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # scan the full history, not just the tip
          persist-credentials: false
      - name: install gitleaks (checksum-verified)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
      - name: scan
        run: ./gitleaks git --redact --verbose .
