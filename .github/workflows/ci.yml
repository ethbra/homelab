# Validation only. This workflow never deploys and never touches the server:
# the server pulls and applies signed commits itself (docs/design/IAC-DESIGN.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: yamllint
        run: |
          pip install --quiet yamllint==1.38.0
          yamllint --strict .
      - name: shellcheck
        run: find scripts -name '*.sh' -type f -not -path 'scripts/obsolete/*' -print0 | xargs -0 -r shellcheck
      - name: secrets/ is encrypted
        run: scripts/check-sops-encrypted.sh

  ansible:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: install ansible (pinned)
        run: pip install --quiet ansible-core==2.19.13 ansible-lint==26.9.0
      - name: install collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: syntax check
        run: ansible-playbook site.yml --syntax-check
      - name: ansible-lint
        run: ansible-lint

  # No secrets here: init only fetches the provider (pinned by the lock file)
  # and validate never reads the encrypted state or calls Cloudflare.
  tofu:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tofu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: install opentofu (same pinned .deb as the base role)
        run: |
          defaults=../ansible/roles/base/defaults/main.yml
          version=$(awk '/^base_tofu_version:/ {print $2}' "$defaults")
          sha256=$(awk '/^base_tofu_sha256:/ {print $2}' "$defaults")
          deb="tofu_${version}_amd64.deb"
          curl -fsSLO "https://github.com/opentofu/opentofu/releases/download/v${version}/${deb}"
          echo "${sha256}  ${deb}" | sha256sum -c -
          sudo dpkg -i "${deb}"
      - name: fmt
        run: tofu fmt -check -recursive -diff
      - name: init
        run: tofu init -backend=false -input=false -lockfile=readonly
      - name: validate
        run: tofu validate

  # Same pinned image as the stack, so a config that breaks nginx never
  # reaches the box (the stacks role restarts nginx when config/ changes).
  nginx:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: nginx -t
        run: |
          image=$(awk '/^ +image:/ {print $2}' stacks/nginx/compose.yaml)
          docker run --rm -v "$PWD/stacks/nginx/config:/etc/nginx/conf.d:ro" "$image" nginx -t

  gitleaks:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # scan the full history, not just the tip
          persist-credentials: false
      - name: install gitleaks (checksum-verified)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
      - name: scan
        run: ./gitleaks git --redact --verbose .
