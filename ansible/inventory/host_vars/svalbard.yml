# Facts about this machine that more than one role needs.
lan_ip: 192.168.1.22          # reserved for this host in the router (see PROGRESS)
admin_user: svalbard

minecraft_port: 25565
tcpshield_fallback_ranges:    # https://tcpshield.com/v4/ (the script fetches the live list first)
  - 198.178.119.0/24
  - 104.234.6.0/25

velocity_dir: /opt/velocity
# Dropped from everywhere; carried over from the old /etc/iptables/rules.v4.
firewall_blocked_sources:
  - 45.148.10.134/32
  - 4.180.183.240/32

firewall_script: /usr/local/sbin/homelab-tcpshield-firewall

# Pre-migration locations, read once to copy the jars and then left as a rollback.
velocity_legacy_dir: /home/svalbard/projects/active/velocity
firewall_legacy_script: /home/svalbard/projects/active/firewall-velocity-tcpshield.sh

# Disruptive restarts (Docker, Velocity) only happen when this is true:
#   ansible-playbook site.yml -K -e allow_disruptive_restarts=true
allow_disruptive_restarts: false

# Phase 3 switch (docs/current/RUNBOOK.md, "Storage and stacks cutover").
# false: the storage role leaves CasaOS's /DATA pool alone and the stacks role
# only renders files into /opt/homelab/stacks. true: fstab owns /DATA, Docker
# waits for it, and the stacks role runs `docker compose up`.
storage_cutover_done: false

# Pool branches, hard drives only (IAC-DESIGN "Storage").
storage_disks:
  - path: /mnt/HDD_A
    uuid: 9e35453e-b2f9-4f35-854c-2a2c6de65d29
  - path: /mnt/HDD_B
    uuid: bbfac642-66a5-4e5d-b19a-07df2e06e192

# Bring-up order, lowest risk first. Each name is a directory under stacks/.
stacks:
  - prowlarr
  - overseerr
  - sonarr
  - radarr
  - transmission
  - plex
  - crafty
