[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = .ansible/collections
interpreter_python = /usr/bin/python3
callback_result_format = yaml
retry_files_enabled = False
nocows = True
# Don't also log every module invocation to syslog: under the pull agent it
# floods journalctl -u homelab-pull ("Invoked with ...") and hides the results.
no_target_syslog = True

[diff]
always = True
context = 3
