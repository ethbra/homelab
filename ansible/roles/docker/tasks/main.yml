- name: Docker apt key
  ansible.builtin.copy:
    src: docker.asc
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Docker apt repository
  ansible.builtin.copy:
    src: docker.list
    dest: /etc/apt/sources.list.d/docker.list
    owner: root
    group: root
    mode: "0644"

- name: Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

# min-api-version 1.24 keeps CasaOS's old Docker client working; drop it with CasaOS.
# Written without a trailing newline so it is byte-identical to the live file.
- name: Docker daemon config
  ansible.builtin.copy:
    content: "{{ docker_daemon_config | to_nice_json(indent=4) }}"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

# Containers bind-mount /DATA. If the pool isn't mounted, starting them would
# show the apps an empty directory (Plex and the *arrs would see everything as
# missing), so Docker doesn't start at all. Takes effect at the next start;
# no restart needed. Only after the cutover, when fstab owns /DATA.
- name: Docker drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: storage_cutover_done | bool

- name: Docker waits for the storage pool
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/homelab-storage.conf
    content: |
      [Unit]
      RequiresMountsFor={{ storage_pool_mount | default('/DATA') }}
    owner: root
    group: root
    mode: "0644"
  when: storage_cutover_done | bool
  notify: Reload systemd (docker)
