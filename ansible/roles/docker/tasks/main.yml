- name: Docker apt key
  ansible.builtin.copy:
    src: docker.asc
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Docker apt repository
  ansible.builtin.copy:
    src: docker.list
    dest: /etc/apt/sources.list.d/docker.list
    owner: root
    group: root
    mode: "0644"

- name: Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

# min-api-version 1.24 keeps CasaOS's old Docker client working; drop it with CasaOS.
# Written without a trailing newline so it is byte-identical to the live file.
- name: Docker daemon config
  ansible.builtin.copy:
    content: "{{ docker_daemon_config | to_nice_json(indent=4) }}"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker
