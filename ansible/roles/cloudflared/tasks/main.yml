- name: Cloudflare apt key
  ansible.builtin.copy:
    src: cloudflare-main.gpg
    dest: /usr/share/keyrings/cloudflare-main.gpg
    owner: root
    group: root
    mode: "0644"

- name: Cloudflare apt repository
  ansible.builtin.copy:
    src: cloudflared.list
    dest: /etc/apt/sources.list.d/cloudflared.list
    owner: root
    group: root
    mode: "0644"

- name: Cloudflared package
  ansible.builtin.apt:
    name: cloudflared
    state: present

- name: Tunnel token
  ansible.builtin.copy:
    content: "{{ cloudflared_tunnel_token }}"
    dest: /etc/cloudflared/token
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  notify: Restart cloudflared

- name: Cloudflared unit
  ansible.builtin.copy:
    src: cloudflared.service
    dest: /etc/systemd/system/cloudflared.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart cloudflared

- name: Cloudflared enabled and running
  ansible.builtin.systemd_service:
    name: cloudflared
    enabled: true
    state: started

# The cloudflared-update timer is retired by the deprecated role; apt and
# unattended-upgrades (base role) keep cloudflared current.
