- name: Stack secrets are in SOPS
  ansible.builtin.assert:
    that:
      - media_apps_username is defined
      - media_apps_password is defined
      # .env values are single-quoted so compose takes them literally ($ included)
      - "\"'\" not in media_apps_username ~ media_apps_password"
    fail_msg: "Add media_apps_username / media_apps_password with sops secrets/svalbard.yaml (no ' in either)"
    quiet: true

# Retiring a stack: move it from `stacks` (host_vars) to `stacks_absent`.
# Taken down before the others start, so a replacement can reuse its ports.
- name: Retired stacks are not also active
  ansible.builtin.assert:
    that: stacks | intersect(stacks_absent) | length == 0
    fail_msg: "{{ stacks | intersect(stacks_absent) }} are in both stacks and stacks_absent"
    quiet: true

- name: Read the retired stacks' compose files
  ansible.builtin.stat:
    path: "{{ stacks_dir }}/{{ item }}/compose.yaml"
  loop: "{{ stacks_absent }}"
  register: stacks_absent_compose

# Bind-mounted app data (/srv/appdata, /DATA) is not touched.
- name: Retired stacks are down
  community.docker.docker_compose_v2:
    project_src: "{{ stacks_dir }}/{{ item.item }}"
    state: absent
  loop: "{{ stacks_absent_compose.results | selectattr('stat.exists') }}"
  loop_control:
    label: "{{ item.item }}"

- name: Retired stacks' directories are removed
  ansible.builtin.file:
    path: "{{ stacks_dir }}/{{ item }}"
    state: absent
  loop: "{{ stacks_absent }}"

- name: Stack directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ [stacks_dir] + stacks | map('regex_replace', '^', stacks_dir ~ '/') }}"

- name: Compose files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../stacks/{{ item }}/compose.yaml"
    dest: "{{ stacks_dir }}/{{ item }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ stacks }}"

# Optional stacks/<name>/config/, mounted read-only by the stack.
- name: Stack config directories
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../stacks/{{ item }}/config/"
    dest: "{{ stacks_dir }}/{{ item }}/config/"
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"
  loop: "{{ stacks }}"
  when: (playbook_dir ~ '/../stacks/' ~ item ~ '/config') is directory
  register: stacks_config

# The copy above only adds and overwrites, so a file deleted from the repo
# (e.g. an nginx server block) would stay live. Anything deployed under
# config/ that the repo no longer has is removed. Check mode (the drift
# check) reports such files as changed. The repo is on this host
# (ansible_connection: local), like the clone in the gitops role.
- name: Read the repo's and the deployed config files
  ansible.builtin.find:
    paths: "{{ item }}"
    recurse: true
    hidden: true
    file_type: any
  loop:
    - "{{ playbook_dir | dirname }}/stacks"
    - "{{ stacks_dir }}"
  register: stacks_config_files

- name: Config files no longer in the repo are removed
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ stacks_config_files.results[1].files
       | rejectattr('isdir')
       | map(attribute='path')
       | select('match', stacks_config_regex)
       | reject('in', stacks_repo_config_files)
       | list }}
  register: stacks_config_pruned
  vars:
    # Only under config/ of the active stacks: never compose.yaml or .env.
    stacks_config_regex: >-
      ^{{ stacks_dir | regex_escape }}/({{ stacks | map('regex_escape') | join('|') }})/config/
    # The repo's paths, rewritten to where the copy above puts them.
    stacks_repo_config_files: >-
      {{ stacks_config_files.results[0].files
         | rejectattr('isdir')
         | map(attribute='path')
         | map('regex_replace', '^' ~ (playbook_dir | dirname | regex_escape) ~ '/stacks/', stacks_dir ~ '/')
         | list }}

- name: Stack .env files (root-only)
  ansible.builtin.copy:
    content: |
      {% for key, value in stacks_env[item].items() %}
      {{ key }}='{{ value }}'
      {% endfor %}
    dest: "{{ stacks_dir }}/{{ item }}/.env"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ stacks | select('in', stacks_env) }}"
  no_log: true
  diff: false

- name: Stacks running
  community.docker.docker_compose_v2:
    project_src: "{{ stacks_dir }}/{{ item }}"
    state: present
    pull: missing
    wait: true
    wait_timeout: 300
  loop: "{{ stacks }}"

# Not every app rereads its config (nginx doesn't), so a changed config/
# (files added, changed or removed) restarts that stack. A new stack was just
# started with it anyway.
- name: Stacks whose config changed restarted
  community.docker.docker_compose_v2:
    project_src: "{{ stacks_dir }}/{{ item }}"
    state: restarted
    wait: true
    wait_timeout: 300
  loop: >-
    {{ ((stacks_config.results | selectattr('changed', 'defined') | selectattr('changed')
         | map(attribute='item') | list)
        + (stacks_config_pruned.results | selectattr('changed')
           | map(attribute='item')
           | map('regex_replace', '^' ~ (stacks_dir | regex_escape) ~ '/([^/]+)/.*$', '\1') | list))
       | unique }}

# Whichever Minecraft server Crafty runs listens on 25565 inside the container,
# behind Velocity with online-mode=false: anything that reaches it directly
# can join as anyone. Holds for every server, so nothing here names one.
- name: Read the Minecraft port's published addresses
  ansible.builtin.command: docker port crafty-container 25565/tcp
  register: stacks_minecraft_ports
  changed_when: false
  check_mode: false

- name: Minecraft port is published on loopback only
  ansible.builtin.assert:
    that:
      - stacks_minecraft_ports.stdout_lines | length > 0
      - stacks_minecraft_ports.stdout_lines | reject('match', '^127\.0\.0\.1:25565$') | list | length == 0
    fail_msg: "25565 is published on {{ stacks_minecraft_ports.stdout_lines }}; it must be 127.0.0.1 only"
    quiet: true
