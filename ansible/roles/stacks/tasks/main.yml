- name: Stack secrets are in SOPS
  ansible.builtin.assert:
    that:
      - media_apps_username is defined
      - media_apps_password is defined
      # .env values are single-quoted so compose takes them literally ($ included)
      - "\"'\" not in media_apps_username ~ media_apps_password"
    fail_msg: "Add media_apps_username / media_apps_password with sops secrets/svalbard.yaml (no ' in either)"
    quiet: true

- name: Stack directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ [stacks_dir] + stacks | map('regex_replace', '^', stacks_dir ~ '/') }}"

- name: Compose files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../stacks/{{ item }}/compose.yaml"
    dest: "{{ stacks_dir }}/{{ item }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ stacks }}"

- name: Stack .env files (root-only)
  ansible.builtin.copy:
    content: |
      {% for key, value in stacks_env[item].items() %}
      {{ key }}='{{ value }}'
      {% endfor %}
    dest: "{{ stacks_dir }}/{{ item }}/.env"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ stacks | select('in', stacks_env) }}"
  no_log: true
  diff: false

# Before the cutover the containers still belong to CasaOS (same names),
# so nothing is started from here.
- name: Stacks running
  community.docker.docker_compose_v2:
    project_src: "{{ stacks_dir }}/{{ item }}"
    state: present
    pull: missing
    wait: true
    wait_timeout: 300
  loop: "{{ stacks }}"
  when: storage_cutover_done | bool

- name: Read ATM10's published addresses
  ansible.builtin.command: docker port crafty-container 25565/tcp
  register: stacks_atm10_ports
  changed_when: false
  check_mode: false
  when: storage_cutover_done | bool

# online-mode=false: anything that reaches 25565 directly can join as anyone.
- name: ATM10 is published on loopback only
  ansible.builtin.assert:
    that:
      - stacks_atm10_ports.stdout_lines | length > 0
      - stacks_atm10_ports.stdout_lines | reject('match', '^127\.0\.0\.1:25565$') | list | length == 0
    fail_msg: "25565 is published on {{ stacks_atm10_ports.stdout_lines }}; it must be 127.0.0.1 only"
    quiet: true
  when: storage_cutover_done | bool

- name: Read ATM10's execution command
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import sqlite3, sys
        db = sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True)
        print(db.execute("select execution_command from servers where server_id = ?", (sys.argv[2],)).fetchone()[0])
      - "{{ stacks_crafty_db }}"
      - "{{ stacks_atm10_server_id }}"
  register: stacks_atm10_command
  changed_when: false
  check_mode: false
  when: storage_cutover_done | bool

- name: ATM10 runs on Java 21
  ansible.builtin.assert:
    that:
      - stacks_atm10_command.stdout | trim | regex_replace('^"', '') is match(stacks_atm10_java | regex_escape)
    fail_msg: "Set ATM10's execution command in Crafty to start with {{ stacks_atm10_java }}"
    quiet: true
  when: storage_cutover_done | bool
