- name: Adoptium apt key
  ansible.builtin.copy:
    src: adoptium.gpg
    dest: /etc/apt/keyrings/adoptium.gpg
    owner: root
    group: root
    mode: "0644"

- name: Adoptium apt repository
  ansible.builtin.copy:
    src: adoptium.list
    dest: /etc/apt/sources.list.d/adoptium.list
    owner: root
    group: root
    mode: "0644"

- name: Java for Velocity
  ansible.builtin.apt:
    name: temurin-25-jdk
    state: present

- name: Velocity group
  ansible.builtin.group:
    name: "{{ velocity_user }}"
    system: true

- name: Velocity service account
  ansible.builtin.user:
    name: "{{ velocity_user }}"
    group: "{{ velocity_user }}"
    system: true
    home: "{{ velocity_dir }}"
    create_home: false
    shell: /usr/sbin/nologin

- name: Velocity directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ velocity_user }}"
    group: "{{ velocity_user }}"
    mode: "0750"
  loop:
    - "{{ velocity_dir }}"
    - "{{ velocity_dir }}/plugins"
    - "{{ velocity_dir }}/plugins/tcpshield"

- name: Read Velocity and plugin jars
  ansible.builtin.stat:
    path: "{{ velocity_dir }}/{{ item.path }}"
    checksum_algorithm: sha256
  loop: "{{ velocity_jars }}"
  loop_control:
    label: "{{ item.path }}"
  register: velocity_jar_stats

# The jars are placed by hand (not in git); a new version means a new pin.
- name: Jars match their pinned checksums
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.checksum == item.item.sha256
    fail_msg: "{{ item.item.path }} is missing from {{ velocity_dir }} or does not match its pinned sha256"
    quiet: true
  loop: "{{ velocity_jar_stats.results }}"
  loop_control:
    label: "{{ item.item.path }}"

- name: Velocity config
  ansible.builtin.template:
    src: velocity.toml.j2
    dest: "{{ velocity_dir }}/velocity.toml"
    owner: "{{ velocity_user }}"
    group: "{{ velocity_user }}"
    mode: "0640"
  notify: Restart velocity

- name: Velocity start script
  ansible.builtin.template:
    src: start.sh.j2
    dest: "{{ velocity_dir }}/start.sh"
    owner: root
    group: "{{ velocity_user }}"
    mode: "0750"
  notify: Restart velocity

- name: Velocity icon and RealIP config
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ velocity_dir }}/{{ item.dest }}"
    owner: "{{ velocity_user }}"
    group: "{{ velocity_user }}"
    mode: "0640"
  loop:
    - src: server-icon.png
      dest: server-icon.png
    - src: tcpshield-config.toml
      dest: plugins/tcpshield/config.toml
  loop_control:
    label: "{{ item.dest }}"
  notify: Restart velocity

# Must match the secret in the live server's forwarding config (PCF or Paper).
- name: Forwarding secret
  ansible.builtin.copy:
    content: "{{ velocity_forwarding_secret }}"
    dest: "{{ velocity_dir }}/forwarding.secret"
    owner: "{{ velocity_user }}"
    group: "{{ velocity_user }}"
    mode: "0600"
  no_log: true
  diff: false
  notify: Restart velocity

- name: Velocity unit
  ansible.builtin.template:
    src: velocity.service.j2
    dest: /etc/systemd/system/velocity.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd (velocity)
    - Restart velocity

- name: Velocity enabled and running
  ansible.builtin.systemd_service:
    name: velocity
    enabled: true
    state: started
