# Handler names are global across roles, so each one is unique to its role.
# Handlers run in the order listed here: reload before restart.

# Runs even when the restart below is skipped, so systemd never keeps a stale unit loaded.
- name: Reload systemd (velocity)
  ansible.builtin.systemd_service:
    daemon_reload: true

# Restarting Velocity disconnects every player, so it is opt-in.
- name: Restart velocity
  ansible.builtin.systemd_service:
    name: velocity
    state: restarted
    daemon_reload: true
  when: allow_disruptive_restarts | bool

- name: Restart velocity (skipped)
  ansible.builtin.debug:
    msg: "Velocity config changed; restart it when nobody is online (re-run with -e allow_disruptive_restarts=true)"
  when: not (allow_disruptive_restarts | bool)
  listen: Restart velocity
