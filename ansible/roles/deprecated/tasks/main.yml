- name: Retired packages are purged
  ansible.builtin.apt:
    name: "{{ deprecated_packages }}"
    state: absent
    purge: true

- name: Check for the Ollama unit
  ansible.builtin.stat:
    path: /etc/systemd/system/ollama.service
  register: deprecated_ollama_unit

- name: Ollama is stopped and disabled
  ansible.builtin.systemd_service:
    name: ollama
    state: stopped
    enabled: false
  when: deprecated_ollama_unit.stat.exists

- name: Ollama files are removed
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ deprecated_ollama_paths }}"
  notify: Reload systemd (deprecated)

- name: Ollama service account is removed
  ansible.builtin.user:
    name: ollama
    state: absent

- name: Ollama group is removed
  ansible.builtin.group:
    name: ollama
    state: absent

- name: Check for the cloudflared-update timer
  ansible.builtin.stat:
    path: /etc/systemd/system/cloudflared-update.timer
  register: deprecated_cloudflared_update_timer

- name: Cloudflared-update timer is stopped and disabled
  ansible.builtin.systemd_service:
    name: cloudflared-update.timer
    state: stopped
    enabled: false
  when: deprecated_cloudflared_update_timer.stat.exists

- name: Left-over files are removed
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ deprecated_paths }}"
  notify: Reload systemd (deprecated)

# Once their unit files are gone (below) there is nothing left to stop.
# LoadState is "loaded" only while the unit file exists; a unit that was left
# failed stays listed (and service_facts can still call it "failed") after
# its file is removed, and systemctl can't stop or disable it then.
- name: Read the CasaOS units' load state
  ansible.builtin.systemd_service:
    name: "{{ item }}"
  loop: "{{ deprecated_casaos_services }}"
  register: deprecated_casaos_units
  check_mode: false
  when: storage_cutover_done | bool

- name: CasaOS services are stopped and disabled
  ansible.builtin.systemd_service:
    name: "{{ item.item }}"
    state: stopped
    enabled: false
  loop: "{{ deprecated_casaos_units.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - storage_cutover_done | bool
    - item.status.LoadState | default('not-found') == 'loaded'

- name: CasaOS packages are purged
  ansible.builtin.apt:
    name: "{{ deprecated_casaos_packages }}"
    state: absent
    purge: true
  when: storage_cutover_done | bool

- name: CasaOS files are removed
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ deprecated_casaos_paths }}"
  when: storage_cutover_done | bool
  notify: Reload systemd (deprecated)
