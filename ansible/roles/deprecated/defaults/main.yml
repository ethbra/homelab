# Software that was used once and is now removed on purpose. Keeping it here
# (instead of uninstalling by hand) makes the removal reviewable and re-runnable.
deprecated_packages:
  # Samba: the only share was CasaOS's guest-writable [Shared]. The files in
  # /DATA/Media/Shared are kept; purging only removes the server and its config.
  - samba
  - samba-common
  - samba-common-bin
  - samba-ad-provision
  - samba-dsdb-modules
  - samba-vfs-modules
  - python3-samba
  # Remote desktop: replaced by SSH + VS Code.
  - xrdp
  - xorgxrdp
  # Boot-time restore of a rules snapshot taken while ATM10 was still published
  # through Docker. It re-adds stale Docker rules at every boot; Docker writes its
  # own, and the firewall role owns the rest (its two raw drops moved there).
  # FLUSH_ON_STOP=0, so purging leaves the running rules alone.
  - iptables-persistent
  - netfilter-persistent

# Ollama was installed with its upstream script, not apt.
# Its data under /DATA/AppData (ollama-nvidia, open-webui-ollama) is kept.
deprecated_ollama_paths:
  - /etc/systemd/system/ollama.service
  - /usr/local/bin/ollama
  - /usr/local/lib/ollama
  - /usr/share/ollama

# Left-over files, removed on purpose.
deprecated_paths:
  # Upstream's auto-updater from `cloudflared service install`; apt and
  # unattended-upgrades (base role) keep cloudflared current instead.
  - /etc/systemd/system/cloudflared-update.timer
  - /etc/systemd/system/cloudflared-update.service
  # Native Plex is gone; the repo line was already commented out.
  - /etc/apt/sources.list.d/plexmediaserver.list
  - /usr/share/keyrings/plexmediaserver.gpg
  # Copy of the Debian sources; apt ignores *.bak, but it misleads readers.
  - /etc/apt/sources.list.d/nonfree.list.bak
  # Not a package file (see dpkg -L), so it is removed explicitly.
  - /etc/iptables/rules.v4

# CasaOS, after the storage/stacks cutover (storage_cutover_done): services
# stopped and disabled, then its files removed (the old data copies were
# deleted by hand on 2026-10-03). Never `casaos-uninstall`: its prompts default
# to deleting all containers and /DATA/AppData.
deprecated_casaos_services:
  - casaos.service
  - casaos-app-management.service
  - casaos-gateway.service
  - casaos-user-service.service
  - casaos-message-bus.service
  - casaos-local-storage.service   # its mergerfs process was the old /DATA pool
  - rclone.service                 # CasaOS's rclone daemon (unauthenticated socket)
  - devmon@devmon.service          # automounts removable drives for CasaOS

# devmon@.service comes from this package.
deprecated_casaos_packages:
  - udevil

# Not from packages: CasaOS's installer put these in place (2025-06-02).
# /var/lib/casaos held the old compose files, including plaintext app logins.
deprecated_casaos_paths:
  - /usr/bin/casaos
  - /usr/bin/casaos-app-management
  - /usr/bin/casaos-cli
  - /usr/bin/casaos-gateway
  - /usr/bin/casaos-local-storage
  - /usr/bin/casaos-message-bus
  - /usr/bin/casaos-uninstall
  - /usr/bin/casaos-user-service
  - /usr/bin/rclone                # installed with CasaOS, only used by it
  - /etc/systemd/system/casaos.service
  - /lib/systemd/system/casaos-app-management.service
  - /lib/systemd/system/casaos-gateway.service
  - /lib/systemd/system/casaos-user-service.service
  - /lib/systemd/system/casaos-message-bus.service
  - /lib/systemd/system/casaos-local-storage.service
  - /lib/systemd/system/rclone.service
  - /etc/bash_completion.d/casaos-cli-completion
  - /etc/casaos
  - /usr/share/casaos
  - /var/log/casaos
  - /var/lib/casaos
  - /run/casaos
  - /run/rclone
