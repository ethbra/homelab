- name: Svalbard host baseline
  hosts: svalbard
  become: true
  pre_tasks:
    - name: Load encrypted secrets
      community.sops.load_vars:
        file: ../secrets/svalbard.yaml
      no_log: true
      tags: [always]
  roles:
    - role: base
      tags: [base]
    - role: storage
      tags: [storage]
    - role: docker
      tags: [docker]
    - role: nvidia_toolkit
      tags: [nvidia]
    - role: cloudflared
      tags: [cloudflared]
    - role: firewall
      tags: [firewall]
    - role: velocity
      tags: [velocity]
    - role: stacks
      tags: [stacks]
    - role: access
      tags: [access]
    - role: deprecated
      tags: [deprecated]
    - role: gitops
      tags: [gitops]
